plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'trim-enchantments'
}

repositories {
	maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "maven.modrinth:better-combat:${project.bettercombat_version}"
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	implementation "maven.modrinth:player-animation-library:${project.player_animation_lib_version}"
	// Punchy is a required mod, but it is not on a maven, so it compiles against the local jar.
	compileOnly files("libs/punchy-2.8a-fabric-26.2.jar")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The UI lab: the smithing panel and Field Guide drawn by the mod's own `ui` package with Minecraft's
// font and textures from the client jar, no game needed. `./gradlew uiLab` opens it; see docs/ui-lab.md.
sourceSets {
	uilab {
		java {
			srcDir 'src/uilab/java'
			srcDir 'src/main/java'
			include 'dev/vadim/bcenchantments/ui/**'
			include 'dev/vadim/bcenchantments/lab/**'
		}
	}
}

tasks.register('uiLab', JavaExec) {
	group = 'application'
	description = 'Opens the UI lab: edit the smithing panel and Field Guide without starting Minecraft.'
	classpath = sourceSets.uilab.runtimeClasspath
	mainClass = 'dev.vadim.bcenchantments.lab.Lab'
	workingDir = projectDir
	jvmArgs '-Dsun.java2d.uiScale=1', '-Dfile.encoding=UTF-8'
	if (project.hasProperty('labArgs')) {
		args project.property('labArgs').toString().split(' ')
	}
}